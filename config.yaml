# =============================================================
# LLM-Based Crypto Trading Agent Configuration
# =============================================================

# --- 거래 설정 ---
trading:
  # 시총 상위 N개 종목
  top_n_coins: 20
  # 롱 진입 기준 점수 (기술적 + 거시적/정량적 합산)
  long_threshold: 10
  # 숏 진입 기준 점수
  short_threshold: -10
  # 레버리지 배수
  leverage: 5
  # 기본 마진 모드: cross / isolated
  margin_mode: isolated

# --- 포지션 사이징 (Kelly Criterion 기반) ---
position_sizing:
  # Kelly 분수 적용 비율 (풀 켈리 = 1.0, 보수적 = 0.25~0.5)
  kelly_fraction: 0.25
  # 단일 포지션 최대 비율 (잔고 대비 %)
  max_position_pct: 5.0
  # 단일 포지션 최소 비율 (잔고 대비 %)
  min_position_pct: 0.5
  # 최소 현금 보유 비율 (%)
  min_cash_reserve_pct: 30.0
  # 전체 투자 한도 (잔고 대비 %)
  max_total_exposure_pct: 60.0

# --- 분석 점수 범위 ---
scoring:
  # 기술적 분석 (ICT 차트 기반)
  technical_min: -25
  technical_max: 25
  # 거시적/정량적 분석 (뉴스, SNS 등)
  macro_quant_min: -25
  macro_quant_max: 25

# --- ICT 기반 Risk & Reward ---
risk_reward:
  # 최소 R:R 비율 (1차 TP 기준, 미달 시 진입 거부)
  min_rr_ratio: 3.0
  # SL 여유 (OB/Swing 레벨에서 추가로 떨어뜨리는 %)
  sl_buffer_pct: 0.2
  # OB/Swing 레벨을 찾지 못했을 때 폴백 SL% (현재가 대비)
  sl_fallback_pct: 3.0
  # TP 레벨을 찾지 못했을 때 폴백 TP% (현재가 대비)
  tp_fallback_pct: 6.0
  # 멀티 TP 타겟 (분할 청산)
  tp_targets:
    - pct: 50       # 포지션의 50%를 1차 TP에서 청산
      target: liquidity   # Buy/Sell-side Liquidity Pool
    - pct: 30       # 30%를 2차 TP에서 청산
      target: fvg         # 미충전 FVG
    - pct: 20       # 20%를 3차 TP에서 청산
      target: opposite_ob # 반대편 OB

# --- 데이터 경로 ---
paths:
  charts: charts/
  candles: data/candles/
  analysis: data/analysis/
  orders: data/orders/
  logs: logs/

# --- 스케줄 (ICT Kill Zone 기반, KST) ---
schedule:
  timezone: Asia/Seoul
  run_hours: [4, 9, 13, 16, 21]
  run_minute: 30
