# =============================================================
# LLM-Based Crypto Trading Agent Configuration
# =============================================================

# --- 거래 설정 ---
trading:
  # 시총 상위 N개 종목
  top_n_coins: 20
  # 롱 진입 기준 점수 (기술적 + 거시적/정량적 합산)
  long_threshold: 10
  # 숏 진입 기준 점수 (숏은 손실 위험 크므로 보수적으로)
  short_threshold: -20
  # 고정 레버리지 (동적 레버리지가 비활성일 때 사용)
  leverage: 5
  # 기본 마진 모드: cross / isolated
  margin_mode: isolated
  # 동적 레버리지: 점수 절대값에 따라 레버리지 선형 보간
  dynamic_leverage:
    enabled: true
    long:
      # long_threshold(+10)일 때 → leverage 3
      # max_score(+50)일 때 → leverage 10
      min_score: 10
      max_score: 50
      min_leverage: 3
      max_leverage: 10
    short:
      # short_threshold(-20)일 때 → leverage 2
      # -50일 때 → leverage 5
      min_score: -20
      max_score: -50
      min_leverage: 2
      max_leverage: 5

# --- 포지션 사이징 (Kelly Criterion 기반) ---
position_sizing:
  # Kelly 분수 적용 비율 (풀 켈리 = 1.0, 보수적 = 0.25~0.5)
  kelly_fraction: 0.25
  # 단일 포지션 최대 비율 (잔고 대비 %)
  max_position_pct: 5.0
  # 단일 포지션 최소 비율 (잔고 대비 %)
  min_position_pct: 0.5
  # 최소 현금 보유 비율 (%)
  min_cash_reserve_pct: 30.0
  # 전체 투자 한도 (잔고 대비 %)
  max_total_exposure_pct: 60.0

# --- 분석 점수 범위 ---
scoring:
  # 기술적 분석 (ICT 차트 기반)
  technical_min: -25
  technical_max: 25
  # 거시적/정량적 분석 (뉴스, SNS 등)
  macro_quant_min: -25
  macro_quant_max: 25

# --- ICT 기반 Risk & Reward (고빈도 트레이딩용 타이트 설정) ---
risk_reward:
  # 최소 R:R 비율 (1차 TP 기준, 미달 시 진입 거부)
  min_rr_ratio: 2.5
  # SL 여유 (OB/Swing 레벨에서 추가로 떨어뜨리는 %)
  sl_buffer_pct: 0.1
  # ICT 레벨이 현재가에서 이 거리 초과면 무시하고 폴백 사용
  # (고빈도 목적으로 먼 레벨은 사용 안 함)
  max_level_distance_pct: 3.5
  # SL 최대 거리 % (이보다 멀면 강제 클램핑)
  max_sl_pct: 2.0
  # 1차 TP 최대 거리 % (이보다 멀면 강제 클램핑)
  max_tp_pct: 6.0
  # OB/Swing 레벨을 찾지 못했을 때 폴백 SL% (현재가 대비)
  sl_fallback_pct: 1.5
  # TP 레벨을 찾지 못했을 때 폴백 TP% (현재가 대비)
  tp_fallback_pct: 4.0
  # 멀티 TP 타겟 (분할 청산)
  tp_targets:
    - pct: 50       # 포지션의 50%를 1차 TP에서 청산
      target: liquidity   # Buy/Sell-side Liquidity Pool
    - pct: 30       # 30%를 2차 TP에서 청산
      target: fvg         # 미충전 FVG
    - pct: 20       # 20%를 3차 TP에서 청산
      target: opposite_ob # 반대편 OB

# --- 데이터 경로 ---
paths:
  charts: charts/
  candles: data/candles/
  analysis: data/analysis/
  orders: data/orders/
  logs: logs/

# --- 스케줄 (ICT Kill Zone 기반, KST) ---
schedule:
  timezone: Asia/Seoul
  run_hours: [4, 9, 13, 16, 21]
  run_minute: 30
