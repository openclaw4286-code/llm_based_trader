# =============================================================
# LLM-Based Crypto Trading Agent Configuration
# =============================================================

# --- 효율성 파라미터 (0~10) ---
# 0: 모든 종목 매 세션마다 풀 분석 (20종목 x 4회/일)
# 10: 최대 효율 (불필요 종목 조기 스킵, 캐시 활용, 변동 없으면 재분석 안함)
efficiency_level: 5

# --- 거래 설정 ---
trading:
  # 인기종목 상위 N개
  top_n_coins: 20
  # 롱 진입 기준 점수 (기술적 + 거시적/정량적 합산)
  long_threshold: 10
  # 숏 진입 기준 점수
  short_threshold: -10
  # 레버리지 배수
  leverage: 5
  # 기본 마진 모드: cross / isolated
  margin_mode: isolated

# --- 포지션 사이징 (Kelly Criterion 기반) ---
position_sizing:
  # Kelly 분수 적용 비율 (풀 켈리 = 1.0, 보수적 = 0.25~0.5)
  kelly_fraction: 0.25
  # 단일 포지션 최대 비율 (잔고 대비 %)
  max_position_pct: 5.0
  # 단일 포지션 최소 비율 (잔고 대비 %)
  min_position_pct: 0.5
  # 최소 현금 보유 비율 (%)
  # Kelly Criterion에 의해 자동 계산되지만, 이 값 이하로는 내려가지 않음
  min_cash_reserve_pct: 30.0
  # 전체 투자 한도 (잔고 대비 %)
  max_total_exposure_pct: 60.0

# --- 분석 점수 범위 ---
scoring:
  # 기술적 분석 (ICT 차트 기반)
  technical_min: -25
  technical_max: 25
  # 거시적/정량적 분석 (뉴스, SNS, 화이트페이퍼 등)
  macro_quant_min: -25
  macro_quant_max: 25

# --- 스캠 탐지 ---
scam_detection:
  # 스캠 의심 시 자동 스킵
  auto_skip_scam: true
  # 스캠 판별 기준 점수 (이 이하면 스캠으로 판단)
  scam_threshold: -15

# --- 데이터 경로 ---
paths:
  charts: charts/
  candles: data/candles/
  analysis: data/analysis/
  orders: data/orders/
  logs: logs/

# --- 스케줄 (04시, 10시, 16시, 22시 KST) ---
schedule:
  timezone: Asia/Seoul
  run_hours: [4, 10, 16, 22]
